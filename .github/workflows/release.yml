name: Release

# Pushing a tag such as v0.5.0 builds the module archive and publishes a GitHub
# release containing exactly the two files Foundry needs:
#   module.json   the manifest (its URL never changes: releases/latest/download)
#   ult-rate.zip  the module, with module.json at the root of the archive
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches module.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(jq -r .version module.json)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match module.json version ${FILE_VERSION}. Fix one of them and push the tag again."
            exit 1
          fi

      - name: Point module.json at this release
        run: |
          jq \
            --arg manifest "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json" \
            --arg download "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ult-rate.zip" \
            '.manifest = $manifest | .download = $download' module.json > module.release.json
          mv module.release.json module.json

      - name: Build the archive
        run: zip -r ult-rate.zip module.json README.md LICENSE CHANGELOG.md scripts styles lang

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VERSION}" 'index($0, v) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # The tag already has a release (for example after the tag was moved to
            # a rewritten commit): refresh the two files instead of failing.
            gh release upload "$GITHUB_REF_NAME" ult-rate.zip module.json --clobber
          elif [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" ult-rate.zip module.json --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" ult-rate.zip module.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
